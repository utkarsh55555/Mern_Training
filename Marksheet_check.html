<body>
    <center><table border="3" style="height: 720px; width: 720px;">
        <tr>
            <th>Enter marks in 1st subject</th>
            <td><input type="number" id="s1"></input></td>
        </tr>
        <tr>
            <th>Enter marks in 2nd subject</th>
            <td><input type="number" id="s2"></input></td>
        </tr>
        <tr>
            <tr>
                <th>Enter marks in 3rd subject</th>
                <td><input type="number" id="s3"></input></td>
            </tr>
            <tr>
                <tr>
                    <th>Enter marks in 4th subject</th>
                    <td><input type="number" id="s4"></input></td>
                </tr>
                <tr> 
                    <tr>
                        <th>Enter marks in 5th subject</th>
                        <td><input type="number" id="s5"></input></td>
                    </tr>
                    <tr>                   
            <th>Total</th>
            <td><input type="number" id="Total"></input></td>
            <tr><th>Percentage</th>
            <td><input type="number" id="Percentage">%</input></td></tr>
            <tr>
                <th>Pass or Fail</th>
                <td><input type="text" id="PorF"></input></td>
            </tr>
        </tr>
        <td colspan="2" style="text-align: center;"><input type="button" value="Percentage" onclick="calc()"></input></td>
    </table></center>   
    <script>
        function calc()  {
            let a=parseInt(document.getElementById('s1').value);
            let b=parseInt(document.getElementById('s2').value);
            let c=parseInt(document.getElementById('s3').value);
            let d=parseInt(document.getElementById('s4').value);
            let e=parseInt(document.getElementById('s5').value);
            document.getElementById("Total").value=(a+b+c+d+e);
            let Percentage=document.getElementById("Percentage").value=(a+b+c+d+e)/5;
            if(Percentage>33) {
                document.getElementById("PorF").value=("pass");
                document.getElementById("PorF").style.background=("green");
            } else {
                document.getElementById("PorF").value=("Fail ");
                document.getElementById("PorF").style.background=("red");
            };
              }
    </script>
</body>
