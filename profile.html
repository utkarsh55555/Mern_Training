<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        section {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 15px;
        }

        h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        img {
            max-width: 200px;
            width: 100%;
            border-radius: 50%;
            margin: 20px 0;
            border: 4px solid #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        p {
            color: #555;
            line-height: 1.6;
            margin: 20px 0;
            font-size: 15px;
        }

        ul {
            list-style: none;
            margin: 30px 0;
            padding: 0;
        }

        ul::before {
            content: "My Skills";
            display: block;
            color: #667eea;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
        }

        li {
            background: #f0f4ff;
            color: #667eea;
            padding: 10px 15px;
            margin: 8px 0;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        li:hover {
            background: #667eea;
            color: white;
            transform: translateX(5px);
        }

        a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
    </style>
</head>
<body>
   <section>
    <h1>Student Profile Card</h1>
    <h2>Name:utkarsh suthar</h2>
    <img src="https://i.pravatar.cc/200?img=12" alt="Profile photo">
    <p>I am currently pursuing Btech from Techno india NJR and i am interested in full stack devolopment</p>
    <ul>
        <li>React</li>
        <li>Javascript</li>
        <li>Python</li>
    </ul>
    <p>My Email: 
        <a href="mailto:utkarshsuthar55@gmail.com?subject=Hello%20Utkarsh&body=I%20wanted%20to%20connect%20with%20you.">
          utkarshsuthar55@gmail.com
        </a>
      </p>
      
   </section> 
</body>
</html>
