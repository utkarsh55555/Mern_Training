<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            
        }

        body {
            background-color: #1a1a1a;
            color: white;
        }

        .container{
            background-color: rgba(101, 79, 101, 0.874);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 900px;
            height: 600px;
            margin: 50px auto;
        }

        .container h4{
            color:darkgray;
        }

        .container img {
            border-radius: 20px;
            width: 50%;
        }

        .container form {
            width: 45%;
        }

        form h2 {
            margin-bottom: 10px;
            }

        form h4 {
            color: darkgray;
            margin-bottom: 30px;
            font-weight: normal;
        }

        input[type="text"]  {
            padding: 15px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            background-color: #4a2f4a;
            color: white;
            width: 42.5%;
        }

        input[type="email"]{
            padding: 15px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            background-color: #4a2f4a;
            color: white;
            width: 90%;
        }

        input[type="password"]{
            padding: 15px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            background-color: #4a2f4a;
            color: white;
            width: 90%;
        }

        input[type="checkbox"] {
            margin-top: 15px;
            margin-right: 8px;
        }

        a {
            color: lightblue;
            text-decoration: none;
        }

        button {
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background-color: #4a2f4a;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #6a3f6a;
        }

        p {
           text-align: center;
           margin: 15px 0 5px;
        }

    </style>
</head>
